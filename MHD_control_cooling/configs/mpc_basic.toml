[simulation]
port = 8080
case_dir = "../2d-example/" # Adjust path as needed relative to server script location
max_time = 2000.0

[controller]
type = "MPC"
# Add common controller params if any, like T_stabilize if needed by multiple types
# T_stabilize = 50.0

[controller.params.MPC]
horizon = 10
model_path = "linmodel.bson" # Path relative to project root or absolute
# Add other MPC specific params: Q/R weights, constraints etc.
# Q_diag = [1.0, 0.1]
# R_diag = [0.01, 0.01, ...]

[logging]
log_dir = "experiment_runs" # Base directory for logs
base_filename = "mpc_basic" # Prefix for log files within the run dir
log_state_interval = 0.5 # How often to log state (temperature, flux)
