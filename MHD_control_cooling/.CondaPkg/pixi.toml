[dependencies]
openssl = ">=3, <3.1"
uv = ">=0.4"
libstdcxx-ng = ">=3.4,<13.0"
protobuf = ">=3"
pillow = "*"
numpy = "*"

    [dependencies.python]
    channel = "conda-forge"
    build = "*cpython*"
    version = ">=3.8,<4, >=3.9"

[project]
name = ".CondaPkg"
platforms = ["linux-64"]
channels = ["conda-forge"]
channel-priority = "strict"
description = "automatically generated by CondaPkg.jl"

[pypi-dependencies]
wandb = ">=0.17"
